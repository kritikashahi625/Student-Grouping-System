<div id="students-list" class="section">
    <h2>Students List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Communication</th>
                <th>Leadership</th>
                <th>Technical</th>
            </tr>
        </thead>
        <tbody>
            {% if students %}
                {% for student in students %}
                    <tr>
                        <td>{{ student.id }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.Communication_Skills }}</td>
                        <td>{{ student.Leadership }}</td>
                        <td>{{ student.Technical_Skill }}</td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="5">No students available</td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>
